services:
  bot:
    build: .
    hostname: umkm-bot               # nama tetap agar profil Chrome tidak dianggap milik komputer lain
    restart: unless-stopped          # hidup lagi otomatis setelah crash/reboot server
    env_file: .env
    environment:
      HOST: 0.0.0.0
    shm_size: "1gb"                  # Chrome butuh shared memory cukup
    volumes:
      - wa_session:/app/.wwebjs_auth
    # Tidak ada "ports": bot hanya bisa diakses lewat Caddy (HTTPS) di bawah.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [bot]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN di file .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  wa_session:
  caddy_data:
